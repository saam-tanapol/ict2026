<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมตอบปัญหา ICT ระดับ ม.ปลาย</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            position: relative;
            margin-bottom: 30px;
            padding-top: 35px;
        }

        .title-group {
            text-align: center;
            flex-grow: 1;
            padding: 0 20px;
        }

        h1 { margin: 10px 0; font-size: 2.2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        h2 { font-size: 1.1rem; font-weight: 300; color: #b2bec3; margin: 0; }

        .logo { width: 100px; height: auto; object-fit: contain; }

        .btn-settings {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-settings:hover { background: rgba(255, 255, 255, 0.4); }

        /* Game Board */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            border-radius: 12px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            user-select: none;
            color: #fff;
        }

        /* โทนสีป้ายตามคะแนน */
        .card-50 { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); } /* ฟ้า */
        .card-100 { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); } /* เขียว */
        .card-150 { background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%); color: #2d3436; } /* เหลือง */
        .card-200 { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); } /* แดง */
        .card-default { background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); }

        .card:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 12px 20px rgba(0,0,0,0.4); }
        .card.opened { background: #2d3436; color: #636e72; cursor: default; transform: none; box-shadow: inset 0 4px 8px rgba(0,0,0,0.5); }

        .card-score {
            position: absolute;
            bottom: 5px;
            right: 8px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: normal;
            color: #fff;
        }

        /* Modal Play */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            color: #2d3436;
            width: 90%;
            max-width: 700px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            animation: popIn 0.3s ease-out forwards;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .badge-play { display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; background: #e17055; color: white;}
        .q-img-preview { max-width: 100%; max-height: 250px; border-radius: 10px; margin-bottom: 15px; object-fit: contain; }
        .q-text { font-size: 1.6rem; margin-bottom: 25px; line-height: 1.4; }
        .a-text { display: none; font-size: 1.4rem; color: #00b894; font-weight: bold; margin-bottom: 25px; background: #e8f8f5; padding: 15px; border-radius: 10px; }
        
        .btn { padding: 10px 20px; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; margin: 5px; transition: 0.2s; }
        .btn-primary { background: #0984e3; color: white; }
        .btn-secondary { background: #b2bec3; color: #2d3436; }
        .btn-danger { background: #e74c3c; color: white; padding: 5px 10px; font-size: 0.9rem; }
        .btn:hover { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Edit Screen */
        #editScreen {
            display: none;
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 20px;
            border-radius: 12px;
            height: 85vh;
            overflow-y: auto;
        }

        .edit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .edit-header h2 { color: #2d3436; font-size: 1.6rem; font-weight: bold; margin:0;}
        
        .edit-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }

        .edit-item { background: #f5f6fa; padding: 15px; border-radius: 8px; border-left: 5px solid #0984e3; display: flex; flex-direction: column; gap: 10px; }
        .edit-item label { font-weight: bold; font-size: 0.9rem; color: #636e72;}
        .edit-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap;}
        
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #dfe6e9; border-radius: 5px; font-family: 'Prompt', sans-serif; }
        input[type="number"] { width: 100px; }
        
        .image-preview-box { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .image-preview-box img { height: 60px; border-radius: 5px; border: 1px solid #ccc; }
        
        #loadingOverlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); color: white; z-index: 2000;
            justify-content: center; align-items: center; font-size: 2rem;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">กำลังโหลดข้อมูลจากฐานข้อมูล...</div>

    <!-- หน้าเกมหลัก -->
    <div id="gameScreen" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="header-container">
            <!-- โลโก้ซ้าย -->
            <img src="ppw512.png" alt="โลโก้โรงเรียน" class="logo">
            <div class="title-group">
                <h1>ตอบปัญหา ICT ระดับมัธยมศึกษาตอนปลาย</h1>
                <h2>รอบชิงชนะเลิศ ณ โรงเรียนโพนทองพัฒนาวิทยา</h2>
                <h2>วันที่ 7 สิงหาคม 2569 ณ ห้องคอมพิวเตอร์ 3</h2>
            </div>
            <!-- โลโก้ขวา -->
            <img src="sci-logo.png" alt="โลโก้แผนก" class="logo">
            <button class="btn-settings" onclick="openEditScreen()">⚙️ ตั้งค่าคำถาม</button>
        </div>
        <div class="board" id="board"></div>
    </div>

    <!-- หน้าต่างแสดงคำถามตอนเล่น -->
    <div class="modal" id="playModal">
        <div class="modal-content">
            <div id="playBadge" class="badge-play"></div>
            <div id="playImageContainer" style="display:none;">
                <img id="playImage" class="q-img-preview" src="">
            </div>
            <div class="q-text" id="playQuestion"></div>
            <div class="a-text" id="playAnswer"></div>
            <button class="btn btn-primary" id="btnShowAns" onclick="showAnswer()">ดูเฉลย</button>
            <button class="btn btn-secondary" onclick="closePlayModal()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- หน้าตั้งค่าคำถาม (Edit Screen) -->
    <div id="editScreen">
        <div class="edit-header">
            <h2>⚙️ ตั้งค่าคำถาม-คำตอบ (ระบบ Cloud)</h2>
            <div>
                <button class="btn btn-secondary" onclick="closeEditScreen()">ยกเลิก</button>
                <button class="btn btn-primary" id="btnSaveData" onclick="saveQuestionsToCloud()">💾 บันทึกขึ้น Cloud</button>
            </div>
        </div>
        <div class="edit-grid" id="editFormGrid"></div>
    </div>

    <!-- โหลด Firebase SDK แบบ Modular (ตัด Storage ออก ใช้แค่ Database) -->
    <script type="module">
        // 1. นำเข้า Firebase 
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 2. >>> นำโค้ด Config จาก Firebase Console มาวางทับตรงนี้ <<<
        const firebaseConfig = {
            apiKey: "AIzaSyB7OHNNp3pdjm9Q7LLN9fws6vVSbgGcUx4",
            authDomain: "ict2026-quiz-3abc2.firebaseapp.com",
            projectId: "ict2026-quiz-3abc2",
            storageBucket: "ict2026-quiz-3abc2.firebasestorage.app",
            messagingSenderId: "551408048786",
            appId: "1:551408048786:web:5263d8ed77dcb78e6c644b"
        };

        // 3. เริ่มต้นระบบ Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ข้อมูลเริ่มต้น 25 ข้อ
        const defaultQuestions = [
            { score: 50, q: "จากรูปคือโปรแกรมชื่ออะไร ใช้สำหรับทำอะไร (สัญลักษณ์ตัว W)", a: "ไมโครซอฟท์ เวิร์ด (Microsoft Word)", image: "" },
            { score: 100, q: "จากรูปคือสัญลักษณ์ของโปรแกรมหรือแอพพลิเคชั่นใด ใช้ทำอะไร (สัญลักษณ์วงกลม C)", a: "Canva ใช้ออกแบบกราฟิก โปสเตอร์ สไลด์ งานนำเสนอ", image: "" },
            { score: 150, q: "3, 8, 14, 21, 29, A, B จงหา A+B", a: "86 (A=38, B=48)", image: "" },
            { score: 200, q: "ให้นักเรียนเขียนชื่อ AI ที่นักเรียนรู้จักมาให้ได้มากที่สุด", a: "เช่น ChatGPT, Claude, Gemini, DeepSeek, Siri", image: "" },
            { score: 50, q: "เมื่อคุณแชร์ตำแหน่งตัวเองผ่าน LINE หรือ Google Maps ระบบใช้เทคโนโลยีใด", a: "GPS", image: "" },
            { score: 100, q: "โปรแกรม Excel ใช้สูตร =SUM(10,20,30) จะได้คำตอบเท่าไร", a: "60", image: "" },
            { score: 150, q: "สัญลักษณ์ Flowchart รูปสี่เหลี่ยมด้านขนาน มีความหมายว่าอย่างไร?", a: "Input / output (รับข้อมูล / แสดงข้อมูล)", image: "" },
            { score: 200, q: "จากโปรแกรม python: a = 5, b = 3, c = a * b, print(c + 2) จะมีผลลัพธ์เท่าใด?", a: "17", image: "" },
            { score: 50, q: "ปุ่มลัด Ctrl + S ในโปรแกรม Microsoft Word ใช้ทำอะไร", a: "ใช้สำหรับบันทึกไฟล์งาน (Save)", image: "" },
            { score: 100, q: "อุปกรณ์ใดทำหน้าที่เหมือนเป็น 'สมอง' ของคอมพิวเตอร์?", a: "CPU (หน่วยประมวลผลกลาง)", image: "" },
            { score: 150, q: "www ย่อมาจากคำว่าอะไร", a: "World Wide Web (เวิลด์ ไวด์ เว็บ)", image: "" },
            { score: 200, q: "จงเขียนตัวอย่าง IP Address มา 1 IP", a: "เช่น 192.168.1.1", image: "" },
            { score: 50, q: "ปุ่มบนคีย์บอร์ดที่ใช้ “พิมพ์เว้นวรรค” คือปุ่มอะไร", a: "ปุ่ม Spacebar (สเปซบาร์)", image: "" },
            { score: 100, q: "จากภาพคือ Syntax ของภาษาโปรแกรมใด: print('Hello, World!')", a: "Python", image: "" },
            { score: 150, q: "อินเทอร์เน็ตของสรรพสิ่ง (Internet of Things: IoT) คืออะไร", a: "เทคโนโลยีที่ทำให้อุปกรณ์ต่าง ๆ เชื่อมต่ออินเทอร์เน็ตได้", image: "" },
            { score: 200, q: "5G ต่างจาก 4G อย่างไรอธิบายง่ายๆคร่าวๆ", a: "5G เร็วกว่า เสถียรกว่า และรองรับการเชื่อมต่อพร้อมกันได้มากกว่า", image: "" },
            { score: 50, q: "ให้นักเรียนเขียนอุปกรณ์รับเข้าข้อมูล (input hardware) อย่างน้อย 2 ชนิด", a: "เช่น คีย์บอร์ด, เมาส์, สแกนเนอร์, ไมโครโฟน", image: "" },
            { score: 100, q: "ยกตัวอย่างเกมที่ใช้ AR (Augmented Reality) ที่นักเรียนรู้จัก", a: "เช่น Pokémon GO, Jurassic World Alive", image: "" },
            { score: 150, q: "หากมีคนส่งลิงก์แปลก ๆ มาให้ในแชต ควรทำอย่างไร", a: "ไม่กดลิงก์, ตรวจสอบกับผู้ส่งก่อน, แจ้งผู้ปกครอง/ครู", image: "" },
            { score: 200, q: "เทคโนโลยี Deepfake คืออะไร และมีความเสี่ยงอย่างไร", a: "เทคโนโลยีที่ใช้ AI สร้างภาพ/เสียงปลอม เสี่ยงต่อการหลอกลวง", image: "" },
            { score: 50, q: "อุปกรณ์ที่ใช้เก็บข้อมูลถาวรในคอมพิวเตอร์เรียกว่าอะไร?", a: "ฮาร์ดดิสก์ (HDD) หรือ SSD", image: "" },
            { score: 100, q: "Google Forms ใช้สำหรับทำอะไร?", a: "สร้างแบบสอบถามหรือแบบทดสอบออนไลน์", image: "" },
            { score: 150, q: "ไวรัสคอมพิวเตอร์คืออะไร?", a: "โปรแกรมมุ่งร้ายที่สร้างมาเพื่อก่อกวนหรือทำลายระบบ", image: "" },
            { score: 200, q: "Phishing (ฟิชชิ่ง) คือการหลอกลวงแบบใด?", a: "หลอกลวงผ่านอีเมลหรือเว็บปลอมเพื่อเอาข้อมูลส่วนตัว", image: "" },
            { score: 100, q: "ไฟล์นามสกุล .mp4 เป็นไฟล์ประเภทใด?", a: "ไฟล์วิดีโอ", image: "" }
        ];

        let questions = JSON.parse(JSON.stringify(defaultQuestions));

        // แสดงหน้าโหลด
        function showLoading(text) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.innerText = text;
            overlay.style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // ดึงข้อมูลจากฐานข้อมูล Firestore แบบทีละข้อ
        async function loadDataFromCloud() {
            showLoading("กำลังโหลดข้อมูลจากฐานข้อมูล...");
            try {
                // ดึงข้อมูลทั้งหมดใน Collection ict_quiz_board
                const querySnapshot = await getDocs(collection(db, "ict_quiz_board"));
                
                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        // รูปแบบชื่อเอกสารคือ q_0, q_1, q_2 ...
                        if(docSnap.id.startsWith('q_')) {
                            const index = parseInt(docSnap.id.split('_')[1]);
                            if(!isNaN(index) && index < 25) {
                                questions[index] = docSnap.data();
                            }
                        }
                    });
                } else {
                    // ถ้ายังไม่มีฐานข้อมูล (เปิดครั้งแรก) ให้บันทึกค่า Default ลงไปเลย
                    await saveQuestionsToCloud(true); 
                }
            } catch (error) {
                console.warn("Offline Mode or Firebase Config Error:", error);
                // ไม่ต้อง Alert แล้วถ้าออฟไลน์ ให้ใช้ Default เล่นไปก่อนได้เลย
            } finally {
                renderBoard();
                hideLoading();
            }
        }

        // --- ฟังก์ชันสำหรับการเล่นเกม ---
        function getColorClass(score) {
            const s = parseInt(score);
            if(s === 50) return 'card-50';
            if(s === 100) return 'card-100';
            if(s === 150) return 'card-150';
            if(s === 200) return 'card-200';
            return 'card-default';
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = `card ${getColorClass(q.score)}`;
                card.innerHTML = `${index + 1}<div class="card-score">${q.score} pts</div>`;
                card.onclick = () => openCard(index, card);
                board.appendChild(card);
            });
        }

        function openCard(index, cardEl) {
            const q = questions[index];
            document.getElementById('playBadge').innerText = `ป้ายที่ ${index + 1} | คะแนน: ${q.score}`;
            document.getElementById('playQuestion').innerText = q.q;
            document.getElementById('playAnswer').innerText = "เฉลย: " + q.a;
            
            const imgContainer = document.getElementById('playImageContainer');
            const imgTag = document.getElementById('playImage');
            if(q.image && q.image.trim() !== "") {
                imgTag.src = q.image;
                imgContainer.style.display = 'block';
            } else {
                imgTag.src = "";
                imgContainer.style.display = 'none';
            }
            
            document.getElementById('playAnswer').style.display = 'none';
            document.getElementById('btnShowAns').style.display = 'inline-block';
            
            cardEl.classList.add('opened');
            cardEl.className = 'card opened'; 
            document.getElementById('playModal').style.display = 'flex';
        }

        // --- ฟังก์ชันสำหรับ Edit Screen ---
        function renderEditForm() {
            const grid = document.getElementById('editFormGrid');
            grid.innerHTML = '';
            questions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'edit-item';
                
                let imgPreviewHTML = '';
                if(q.image && q.image.trim() !== "") {
                    imgPreviewHTML = `<img src="${q.image}"><button class="btn-danger" onclick="removeImage(${index})">ลบรูป</button>`;
                }

                item.innerHTML = `
                    <div class="edit-row">
                        <label style="width: 80px;">ป้ายที่ ${index + 1}</label>
                        <label>คะแนน:</label>
                        <input type="number" id="score_${index}" value="${q.score}">
                    </div>
                    <input type="text" id="q_${index}" value="${q.q.replace(/"/g, '&quot;')}" placeholder="คำถาม...">
                    <input type="text" id="a_${index}" value="${q.a.replace(/"/g, '&quot;')}" placeholder="เฉลย...">
                    <div class="edit-row">
                        <label>แนบรูปภาพใหม่:</label>
                        <input type="file" id="file_${index}" accept="image/*" onchange="handleImageUpload(event, ${index})">
                    </div>
                    <div class="image-preview-box" id="imgPreview_${index}">${imgPreviewHTML}</div>
                `;
                grid.appendChild(item);
            });
        }

        // ระบบบีบอัดภาพและแปลงเป็น Text (Base64) เพื่อเก็บบน Database แทน Storage
        function handleImageUpload(event, index) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    // ลดขนาดภาพให้เล็กที่สุดเพื่อไม่ให้หนักฐานข้อมูล
                    const MAX_WIDTH = 500;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // แปลงเป็น Base64 (Quality 0.6)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    questions[index].image = dataUrl;
                    
                    document.getElementById(`imgPreview_${index}`).innerHTML = `<img src="${dataUrl}"><button class="btn-danger" onclick="removeImage(${index})">ลบรูป</button>`;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // บันทึกข้อมูลทั้งหมดลง Firestore ทีละเอกสาร (ป้องกันข้อมูลเกิน 1MB)
        async function saveQuestionsToCloud(silent = false) {
            if(!silent) showLoading("กำลังบันทึกข้อมูล...");
            try {
                if(!silent) {
                    for (let i = 0; i < 25; i++) {
                        questions[i].score = document.getElementById(`score_${i}`).value;
                        questions[i].q = document.getElementById(`q_${i}`).value;
                        questions[i].a = document.getElementById(`a_${i}`).value;
                    }
                }

                // บันทึกแยกทีละข้อ q_0 ถึง q_24
                const promises = [];
                for (let i = 0; i < 25; i++) {
                    const docRef = doc(db, "ict_quiz_board", "q_" + i);
                    promises.push(setDoc(docRef, questions[i]));
                }
                
                // รอให้บันทึกครบ 25 ข้อเสร็จพร้อมกัน
                await Promise.all(promises);

                if(!silent) {
                    alert("บันทึกข้อมูลลงฐานข้อมูลส่วนกลางเรียบร้อยแล้ว!");
                    renderBoard();
                    closeEditScreen();
                }
            } catch (error) {
                console.error("Error saving document: ", error);
                if(!silent) alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลดขนาด/จำนวนรูปภาพลง");
            } finally {
                if(!silent) hideLoading();
            }
        }

        // ลงทะเบียนฟังก์ชันให้ HTML เรียกใช้งานได้
        window.openEditScreen = () => {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('editScreen').style.display = 'block';
            renderEditForm();
        };
        window.closeEditScreen = () => {
            document.getElementById('editScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
        };
        window.showAnswer = () => {
            document.getElementById('playAnswer').style.display = 'block';
            document.getElementById('btnShowAns').style.display = 'none';
        };
        window.closePlayModal = () => {
            document.getElementById('playModal').style.display = 'none';
        };
        window.removeImage = (index) => {
            questions[index].image = "";
            document.getElementById(`imgPreview_${index}`).innerHTML = "";
            document.getElementById(`file_${index}`).value = "";
        };
        window.handleImageUpload = handleImageUpload;
        window.saveQuestionsToCloud = saveQuestionsToCloud;
        window.openCard = openCard;

        // เริ่มต้นดึงข้อมูล
        loadDataFromCloud();
    </script>
</body>
</html>
